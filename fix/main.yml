name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gilded-ledger-source/gilded-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --console=plain > build.log 2>&1
          code=$?
          echo '### Compiler errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E -A2 "error:|What went wrong|FAILED" build.log | grep -v "^\s*at " | head -250 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: gilded-ledger-jar
          path: gilded-ledger-source/gilded-ledger/build/libs/*.jar
